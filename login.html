<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Inceptia Technologies Ltd. | Enterprise Resource Platform (ERP)</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Google Fonts: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #eef4fe;
      color: #0f172a;
    }

    .font-heading {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Panoramic colorful background with high-res art */
    .login-bg-panoramic {
      position: fixed;
      inset: 0;
      background-image: url('assets/login_bg_colorful.jpg');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      pointer-events: none;
      z-index: 0;
    }

    /* Ambient atmospheric glow */
    .ambient-glow {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 40%, rgba(255, 255, 255, 0.35) 0%, rgba(238, 244, 254, 0.15) 60%, rgba(219, 234, 254, 0.3) 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* Translucent Frosted Glass Card */
    .glass-login-card {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.88);
      box-shadow: 0 20px 50px -10px rgba(15, 23, 42, 0.12), 0 0 0 1px rgba(255, 255, 255, 0.7) inset;
    }

    /* Input fields styling */
    .input-field {
      background-color: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(203, 213, 225, 0.85);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .input-field:focus {
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(27, 82, 192, 0.18);
      border-color: #1b52c0;
    }

    /* Primary button matching exact Inceptia logo blue */
    .btn-inceptia {
      background: linear-gradient(135deg, #1e58cb 0%, #1545ad 100%);
      box-shadow: 0 6px 18px -2px rgba(27, 82, 192, 0.35);
      transition: all 0.2s ease-in-out;
    }

    .btn-inceptia:hover {
      background: linear-gradient(135deg, #184ab1 0%, #0f378f 100%);
      box-shadow: 0 8px 24px -2px rgba(27, 82, 192, 0.45);
      transform: translateY(-1px);
    }

    .btn-inceptia:active {
      transform: translateY(0);
      box-shadow: 0 3px 10px -1px rgba(27, 82, 192, 0.3);
    }
  </style>
</head>

<body
  class="min-h-screen relative flex flex-col justify-between items-center antialiased selection:bg-[#1b52c0] selection:text-white p-4 sm:p-6 overflow-x-hidden">

  <!-- Fixed Panoramic Background -->
  <div class="login-bg-panoramic"></div>
  <div class="ambient-glow"></div>

  <!-- Top spacer to center properly -->
  <div class="w-full h-4 sm:h-8"></div>

  <!-- Main Centered Login Section -->
  <main class="w-full max-w-[430px] relative z-10 my-auto">
    <!-- Frosted Glass Card with Translucent Glassmorphism Effect -->
    <div class="glass-login-card rounded-[28px] sm:rounded-[32px] p-7 sm:p-9 transition-all duration-300">

      <!-- 1. Centered Official Logo (Prominent & Balanced like Reference) -->
      <div class="flex items-center justify-center pt-1 mb-2">
        <img src="assets/inceptia_logo.png" alt="Inceptia Technologies Ltd."
          class="h-14 sm:h-16 w-auto object-contain drop-shadow-sm transition-transform hover:scale-[1.02]" />
      </div>

      <!-- 2. Tagline with decorative horizontal divider lines -->
      <div class="flex items-center justify-center gap-2.5 mb-7 text-slate-700">
        <span class="w-8 sm:w-10 h-[1px] bg-gradient-to-r from-transparent to-slate-400/80"></span>
        <span class="text-[11px] sm:text-xs font-bold tracking-tight text-slate-800 font-heading">
          Enterprise Resource Platform (ERP)
        </span>
        <span class="w-8 sm:w-10 h-[1px] bg-gradient-to-l from-transparent to-slate-400/80"></span>
      </div>

      <!-- 3. Standard Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">

        <!-- Email Field -->
        <div>
          <label for="emailInput" class="block text-xs font-bold text-slate-800 mb-1.5">
            Email
          </label>
          <div class="relative">
            <input type="email" id="emailInput" required autocomplete="email"
              placeholder="name@company.com"
              class="input-field w-full rounded-xl pl-9 pr-3.5 py-2.5 text-xs text-slate-800 placeholder-slate-400 focus:outline-none font-medium" />
            <div class="absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none text-[#1b52c0]">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                  d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
                </path>
              </svg>
            </div>
          </div>
        </div>

        <!-- Password Field -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="passwordInput" class="block text-xs font-bold text-slate-800">
              Password
            </label>
            <button type="button" onclick="forgotPassword()"
              class="text-[11px] font-semibold text-[#1b52c0] hover:text-[#123696] hover:underline transition cursor-pointer">
              Forgot password?
            </button>
          </div>
          <div class="relative">
            <input type="password" id="passwordInput" required autocomplete="current-password"
              placeholder="••••••••"
              class="input-field w-full rounded-xl pl-9 pr-9 py-2.5 text-xs text-slate-800 placeholder-slate-400 focus:outline-none font-mono" />
            <div class="absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none text-[#1b52c0]">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                </path>
              </svg>
            </div>
            <!-- Show/Hide Password Toggle -->
            <button type="button" onclick="togglePasswordVisibility()"
              class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition cursor-pointer p-0.5"
              title="Toggle Password Visibility">
              <svg id="eyeIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z">
                </path>
              </svg>
            </button>
          </div>
        </div>

        <!-- Remember Me Checkbox -->
        <div class="flex items-center pt-0.5">
          <label class="flex items-center gap-2 cursor-pointer select-none">
            <input type="checkbox" id="rememberMe" checked
              class="w-4 h-4 rounded text-[#1b52c0] border-slate-300 transition cursor-pointer accent-[#1b52c0]" />
            <span class="text-xs font-semibold text-slate-700">Remember me</span>
          </label>
        </div>

        <!-- Sign-In Submit Button (Matches Exact Inceptia Logo Blue) -->
        <div class="pt-2">
          <button type="submit" id="submitBtn"
            class="btn-inceptia w-full py-2.5 px-4 rounded-2xl text-white font-bold text-xs tracking-wide flex items-center justify-center gap-2 cursor-pointer disabled:opacity-75 disabled:cursor-wait">
            <span id="btnText">Sign In</span>
            <svg id="btnArrow" class="w-4 h-4 transform group-hover:translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
            </svg>
            <!-- Animated Spinner -->
            <svg id="btnSpinner" class="hidden w-4 h-4 animate-spin text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
            </svg>
          </button>
        </div>

      </form>

      <!-- 4. Enterprise Value Pillars (Multi-Company, Role-Based Access, Secure & Reliable, Real-time Insights) -->
      <div class="border-t border-slate-200/70 pt-4 mt-6 flex items-center justify-between text-center">
        <!-- Feature 1: Multi-Company -->
        <div class="flex-1 px-1">
          <div class="w-6 h-6 mx-auto mb-1 flex items-center justify-center text-[#1b52c0]">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4">
              </path>
            </svg>
          </div>
          <span class="block text-[10px] font-bold text-slate-700 leading-tight">Multi-Company</span>
        </div>

        <div class="w-[1px] h-6 bg-slate-200/90 shrink-0"></div>

        <!-- Feature 2: Role-Based Access -->
        <div class="flex-1 px-1">
          <div class="w-6 h-6 mx-auto mb-1 flex items-center justify-center text-[#1b52c0]">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
          </div>
          <span class="block text-[10px] font-bold text-slate-700 leading-tight">Role-Based Access</span>
        </div>

        <div class="w-[1px] h-6 bg-slate-200/90 shrink-0"></div>

        <!-- Feature 3: Secure & Reliable -->
        <div class="flex-1 px-1">
          <div class="w-6 h-6 mx-auto mb-1 flex items-center justify-center text-[#1b52c0]">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z">
              </path>
            </svg>
          </div>
          <span class="block text-[10px] font-bold text-slate-700 leading-tight">Secure & Reliable</span>
        </div>

        <div class="w-[1px] h-6 bg-slate-200/90 shrink-0"></div>

        <!-- Feature 4: Real-time Insights -->
        <div class="flex-1 px-1">
          <div class="w-6 h-6 mx-auto mb-1 flex items-center justify-center text-[#1b52c0]">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z">
              </path>
            </svg>
          </div>
          <span class="block text-[10px] font-bold text-slate-700 leading-tight">Real-time Insights</span>
        </div>
      </div>

    </div>
  </main>

  <!-- Clean Footer Matching Reference Design -->
  <footer class="w-full py-3.5 text-center relative z-10">
    <p class="text-[11px] font-medium text-slate-600/90 tracking-wide">
      © 2026 Inceptia Technologies Ltd. | Enterprise Resource Platform (ERP)
    </p>
  </footer>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Client Interaction Script -->
  <script>
    // 1. Password Visibility Toggle
    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('passwordInput');
      const eyeIcon = document.getElementById('eyeIcon');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        eyeIcon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"></path>
        `;
      } else {
        pwdInput.type = 'password';
        eyeIcon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
        `;
      }
    }

    // 2. Form Submission & Smooth Redirect
    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value.trim();
      const pwd = document.getElementById('passwordInput').value;

      if (!email || !pwd) {
        showToast('Please enter both email and password.');
        return;
      }

      // UI Loading State
      const btn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnArrow = document.getElementById('btnArrow');
      const btnSpinner = document.getElementById('btnSpinner');

      btn.disabled = true;
      btnText.innerText = 'Signing In...';
      btnArrow.classList.add('hidden');
      btnSpinner.classList.remove('hidden');

      showToast('Authenticating with Enterprise Resource Platform...');

      // Redirect transition to ERP Executive Portal
      setTimeout(() => {
        window.location.href = 'erp_cover_page.html';
      }, 700);
    }

    // 3. Forgot Password Interaction
    function forgotPassword() {
      showToast('Password reset link dispatched to your registered corporate email.');
    }

    // 4. Toast Notification System
    function showToast(msg) {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const toast = document.createElement('div');
      toast.className = 'px-4 py-2.5 rounded-xl bg-slate-900/95 text-white text-xs font-semibold shadow-xl backdrop-blur-md flex items-center gap-2 transform transition-all duration-300 translate-y-3 opacity-0 pointer-events-auto border border-white/10';
      toast.innerHTML = `
        <svg class="w-4 h-4 text-blue-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <span>${msg}</span>
      `;
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-3', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('translate-y-3', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }
  </script>

</body>

</html>

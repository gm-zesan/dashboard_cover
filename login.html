<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Inceptia Technologies</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Google Fonts: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }

    .font-heading {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Fixed atmospheric wallpaper matching erp_cover_page.html */
    .erp-bg-fixed {
      position: fixed;
      inset: 0;
      background-image: url('assets/erp_bg.jpg');
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      opacity: 0.16;
      pointer-events: none;
      z-index: 0;
    }

    /* Translucent frosted glass card */
    .executive-card {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.08), 0 4px 12px -2px rgba(15, 23, 42, 0.03);
    }
  </style>
</head>

<body class="min-h-screen relative flex flex-col justify-between items-center antialiased selection:bg-blue-600 selection:text-white p-4 sm:p-6">

  <!-- Atmospheric Background Layer -->
  <div class="erp-bg-fixed"></div>

  <!-- Ambient Glow Orbs -->
  <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[720px] h-[380px] bg-gradient-to-b from-blue-300/20 via-indigo-200/15 to-transparent blur-3xl pointer-events-none z-0"></div>
  <div class="fixed bottom-0 right-1/4 w-[500px] h-[320px] bg-gradient-to-tr from-cyan-200/15 to-blue-200/10 blur-3xl pointer-events-none z-0"></div>

  <!-- Subtle Bottom Skyline Cityscape Silhouette -->
  <div class="fixed bottom-0 inset-x-0 opacity-[0.06] pointer-events-none z-0 flex items-end justify-center">
    <img src="assets/buildings_clean.png" alt="Cityscape" class="w-full max-w-5xl object-contain object-bottom" />
  </div>

  <!-- Top spacer to center properly -->
  <div class="w-full h-8 sm:h-12"></div>

  <!-- Main Centered Login Section -->
  <main class="w-full max-w-[420px] relative z-10 my-auto">
    <!-- Executive Frosted Card -->
    <div class="executive-card rounded-3xl p-8 sm:p-10 transition-all duration-300">

      <!-- Official HD Inceptia Logo -->
      <div class="flex items-center justify-center mb-8">
        <img src="assets/inceptia_logo.png" alt="Inceptia Technologies Ltd" class="h-11 sm:h-12 w-auto object-contain drop-shadow-2xs" />
      </div>

      <!-- Login Form: Email & Password Only -->
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">

        <!-- 1. Email Address -->
        <div>
          <label for="emailInput" class="block text-xs font-semibold text-slate-700 mb-1.5">
            Email
          </label>
          <div class="relative">
            <input type="email" id="emailInput" required autocomplete="email"
              placeholder="name@company.com"
              class="w-full bg-white/90 hover:bg-white focus:bg-white border border-slate-200/90 rounded-xl pl-10 pr-3.5 py-2.5 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition shadow-2xs font-medium" />
            <div class="absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
                </path>
              </svg>
            </div>
          </div>
        </div>

        <!-- 2. Password -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="passwordInput" class="block text-xs font-semibold text-slate-700">
              Password
            </label>
            <button type="button" onclick="forgotPassword()"
              class="text-[11px] font-medium text-blue-600 hover:text-blue-700 hover:underline transition cursor-pointer">
              Forgot password?
            </button>
          </div>
          <div class="relative">
            <input type="password" id="passwordInput" required autocomplete="current-password"
              placeholder="••••••••••••"
              class="w-full bg-white/90 hover:bg-white focus:bg-white border border-slate-200/90 rounded-xl pl-10 pr-10 py-2.5 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition shadow-2xs font-mono" />
            <div class="absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                </path>
              </svg>
            </div>
            <!-- Eye Toggle for Password Visibility -->
            <button type="button" onclick="togglePasswordVisibility()"
              class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition cursor-pointer p-0.5"
              title="Toggle Password Visibility">
              <svg id="eyeIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z">
                </path>
              </svg>
            </button>
          </div>
        </div>

        <!-- Remember Me Checkbox -->
        <div class="flex items-center pt-0.5">
          <label class="flex items-center gap-2 cursor-pointer select-none">
            <input type="checkbox" id="rememberMe" checked
              class="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 border-slate-300 transition cursor-pointer" />
            <span class="text-xs text-slate-600 font-medium">Remember me</span>
          </label>
        </div>

        <!-- Sign-In Submit Button -->
        <div class="pt-2">
          <button type="submit" id="submitBtn"
            class="w-full py-2.5 px-4 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold text-xs tracking-wide shadow-md hover:shadow-lg shadow-blue-500/20 transition-all duration-150 flex items-center justify-center gap-2 cursor-pointer disabled:opacity-75 disabled:cursor-wait">
            <span id="btnText">Sign In</span>
            <svg id="btnArrow" class="w-3.5 h-3.5 transform group-hover:translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
            </svg>
            <!-- Animated Loading Spinner (Hidden by default) -->
            <svg id="btnSpinner" class="hidden w-4 h-4 animate-spin text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
            </svg>
          </button>
        </div>

      </form>

    </div>
  </main>

  <!-- Clean Discreet Footer -->
  <footer class="w-full py-4 text-center relative z-10">
    <p class="text-[11px] text-slate-400 font-medium">
      © 2026 Inceptia Technologies Ltd. All rights reserved.
    </p>
  </footer>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Client Interaction Script -->
  <script>
    // 1. Password Visibility Toggle
    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('passwordInput');
      const eyeIcon = document.getElementById('eyeIcon');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        eyeIcon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"></path>
        `;
      } else {
        pwdInput.type = 'password';
        eyeIcon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
        `;
      }
    }

    // 2. Form Submission & Smooth Redirect
    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value.trim();
      const pwd = document.getElementById('passwordInput').value;

      if (!email || !pwd) {
        showToast('Please enter your email and password.');
        return;
      }

      // UI Loading State
      const btn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnArrow = document.getElementById('btnArrow');
      const btnSpinner = document.getElementById('btnSpinner');

      btn.disabled = true;
      btnText.innerText = 'Signing in...';
      btnArrow.classList.add('hidden');
      btnSpinner.classList.remove('hidden');

      // Redirect transition
      setTimeout(() => {
        window.location.href = 'erp_cover_page.html';
      }, 700);
    }

    // 3. Forgot Password Interaction
    function forgotPassword() {
      showToast('Password reset instructions dispatched to your email.');
    }

    // 4. Toast Notification System
    function showToast(msg) {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const toast = document.createElement('div');
      toast.className = 'px-4 py-2.5 rounded-xl bg-slate-900/95 text-white text-xs font-semibold shadow-xl backdrop-blur-md flex items-center gap-2 transform transition-all duration-300 translate-y-3 opacity-0 pointer-events-auto border border-white/10';
      toast.innerHTML = `
        <svg class="w-4 h-4 text-blue-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <span>${msg}</span>
      `;
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-3', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('translate-y-3', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }
  </script>

</body>

</html>
